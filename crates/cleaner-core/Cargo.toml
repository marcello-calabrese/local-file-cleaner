[package]
name = "cleaner-core"
version = "0.1.0"
edition = "2021"
description = "Parallel scan engine for Local File Cleaner"

[dependencies]
blake3 = "1.8.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
image_hasher = "3.1.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
trash = "5.2.9"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
