[workspace]
resolver = "2"
members = ["crates/cleaner-core", "src-tauri"]

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hashing and image decoding are painfully slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
